// Kontrak gRPC untuk penarikan file image antar node (peer-to-peer).
syntax = "proto3";

package acqagent.v1;

option go_package = "acq-agent/gen/proto/acqagent/v1;acqagentv1";

// Layanan akuisisi: node penarik memanggil Pull ke node sumber.
service AcqAgent {
  // Mengalirkan isi file image dari sumber ke penarik.
  // Chunk terakhir membawa hash SHA-256 sisi sumber untuk verifikasi.
  rpc Pull(PullRequest) returns (stream PullChunk);
  // Mengintip sebagian isi file tanpa menarik seluruhnya (read-only).
  // Dibatasi 64 KiB per panggilan; ikut guard yang sama dengan Pull.
  rpc Preview(PreviewRequest) returns (PreviewResponse);
}

// Permintaan penarikan satu file image.
message PullRequest {
  // Path file image di sisi sumber.
  string path = 1;
}

// Satu potongan isi file, maksimal 1 MiB.
message PullChunk {
  // Isi chunk pada offset ini.
  bytes data = 1;
  // Offset byte awal chunk ini di dalam file.
  uint64 offset = 2;
  // Hanya diisi pada chunk terakhir: hash dan ukuran total sisi sumber.
  SourceHash source_hash = 3;
}

// Ringkasan hash sisi sumber untuk verifikasi di sisi penarik.
message SourceHash {
  // SHA-256 hex dari seluruh file di sisi sumber.
  string sha256_hex = 1;
  // Ukuran total file dalam byte.
  uint64 total_bytes = 2;
}

// Permintaan intip sebagian isi file.
message PreviewRequest {
  // Path file image di sisi sumber.
  string path = 1;
  // Offset byte awal.
  uint64 offset = 2;
  // Jumlah byte diminta; 0 = default 4096, maks 65536.
  uint32 limit = 3;
}

// Potongan isi file untuk pratinjau.
message PreviewResponse {
  // Offset byte awal data ini (gema request).
  uint64 offset = 1;
  // Isi potongan (bisa lebih pendek dari limit di ujung file).
  bytes data = 2;
  // Ukuran total file dalam byte.
  uint64 total_bytes = 3;
}
